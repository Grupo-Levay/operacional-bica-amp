name: Lighthouse

# Auditoria de performance/a11y na página pública (/login) como baseline.
# Workflow separado do CI obrigatório: assertions são "warn", não bloqueiam o merge.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Build
        run: npm run build
        working-directory: app

      - name: Run Lighthouse CI
        run: ./app/node_modules/.bin/lhci autorun --config=.lighthouserc.json
