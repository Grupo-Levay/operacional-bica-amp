# tokens.yaml — Fonte de verdade do design system Bica & AMP 213
# Sincronizado com DESIGN.md e globals.css
# Exportado para TypeScript via tokens/index.ts

color:
  # ── Brand ─────────────────────────────────────────────────────
  bica:           "#C9A368"   # Âmbar Bica — primary
  bica-dark:      "#B98D4E"   # Hover, active
  bica-light:     "rgba(201, 163, 104, 0.14)"
  bica-fg:        "#14100D"   # Texto sobre fundo bica

  amp:            "#B91C1C"   # Tijolo AMP — secondary
  amp-dark:       "#991818"   # Hover, active
  amp-light:      "rgba(185, 28, 28, 0.14)"
  amp-fg:         "#EFE3CC"   # Texto sobre fundo amp

  # ── Aliases semânticos ────────────────────────────────────────
  # Usar estes em componentes — não os brand diretamente
  primary:        "var(--color-bica)"
  primary-dark:   "var(--color-bica-dark)"
  primary-light:  "var(--color-bica-light)"
  primary-fg:     "var(--color-bica-fg)"

  secondary-brand:      "var(--color-amp)"
  secondary-brand-dark: "var(--color-amp-dark)"
  secondary-brand-light:"var(--color-amp-light)"
  secondary-fg:   "var(--color-amp-fg)"

  # ── Status semânticos ─────────────────────────────────────────
  success:        "#4ade80"
  success-bg:     "rgba(74, 222, 128, 0.12)"
  warning:        "#fbbf24"
  warning-bg:     "rgba(251, 191, 36, 0.12)"
  danger:         "#f87171"
  danger-bg:      "rgba(248, 113, 113, 0.12)"

  # ── Parchment (texto e superfícies sobre dark) ────────────────
  b0:  "#F4ECDC"   # oklch(0.940 0.024 72) — quase branco creme
  b1:  "#EFE3CC"   # oklch(0.913 0.025 72) — foreground principal
  b2:  "#D8C9A8"   # oklch(0.825 0.033 72) — texto secundário
  b3:  "#B5A481"   # oklch(0.683 0.038 72) — labels, placeholders
  b4:  "#8D7F66"   # oklch(0.552 0.024 72) — muted foreground

  # ── Ink (backgrounds) ─────────────────────────────────────────
  ink:   "#0B0807"   # oklch(0.065 0.008 52) — preto quase absoluto
  ink2:  "#14100D"   # oklch(0.098 0.010 52) — background card
  ink3:  "#1C1612"   # oklch(0.138 0.012 52) — background principal
  ink4:  "#2A211A"   # oklch(0.190 0.014 52) — superfície elevada

spacing:
  1:   "0.25rem"   # 4px
  2:   "0.5rem"    # 8px
  3:   "0.75rem"   # 12px
  4:   "1rem"      # 16px
  5:   "1.25rem"   # 20px
  6:   "1.5rem"    # 24px
  8:   "2rem"      # 32px
  10:  "2.5rem"    # 40px
  12:  "3rem"      # 48px
  16:  "4rem"      # 64px

typography:
  # ── Fontes ────────────────────────────────────────────────────────
  font-sans:     "'Jost', system-ui, sans-serif"
  font-display:  "'DM Serif Display', serif"
  font-mono:     "'JetBrains Mono', monospace"

  # ── Tamanhos (base) ───────────────────────────────────────────────
  text-xs:       "0.75rem"     # 12px
  text-sm:       "0.875rem"    # 14px
  text-base:     "1rem"        # 16px
  text-lg:       "1.125rem"    # 18px
  text-xl:       "1.25rem"     # 20px
  text-2xl:      "1.5rem"      # 24px
  text-3xl:      "1.875rem"    # 30px

  # ── Escalas Semânticas: Headings ──────────────────────────────────
  text-h1:       "2.25rem"     # 36px — primary heading
  text-h2:       "1.875rem"    # 30px — secondary heading
  text-h3:       "1.5rem"      # 24px — tertiary heading
  line-h1:       "2.75rem"     # 1.22x multiplier
  line-h2:       "2.25rem"     # 1.20x multiplier
  line-h3:       "2rem"        # 1.33x multiplier

  # ── Escalas Semânticas: Body ──────────────────────────────────────
  text-body-lg:  "1.125rem"    # 18px — large body text
  text-body:     "1rem"        # 16px — regular body text (alias text-base)
  text-body-sm:  "0.875rem"    # 14px — small body text
  line-body-lg:  "1.75rem"     # 1.56x multiplier (good for reading)
  line-body:     "1.5rem"      # 1.50x multiplier (standard)
  line-body-sm:  "1.25rem"     # 1.43x multiplier

  # ── Escalas Semânticas: UI (labels, captions, etc) ────────────────
  text-label:    "0.875rem"    # 14px — form labels, badges
  text-caption:  "0.75rem"     # 12px — helper text, metadata
  line-label:    "1.25rem"     # 1.43x multiplier
  line-caption:  "1rem"        # 1.33x multiplier

  # ── Letter-spacing (otimizado para legibilidade) ──────────────────
  letter-h1:     "-0.02em"     # tight tracking para headings grandes
  letter-h2:     "-0.01em"
  letter-h3:     "0em"
  letter-body:   "0em"         # normal tracking
  letter-ui:     "0.01em"      # subtle tracking para UI pequeno

  # ── Pesos ─────────────────────────────────────────────────────────
  font-normal:   "400"
  font-medium:   "500"
  font-semibold: "600"
  font-bold:     "700"

radius:
  sm:   "0.25rem"   # 4px — badges, chips
  md:   "0.5rem"    # 8px — inputs, cards small
  lg:   "0.75rem"   # 12px — cards, modais
  xl:   "1rem"      # 16px — sheets, drawers
  full: "9999px"    # pills, avatares

shadow:
  # Sombras dark-theme reais: preto denso (0.45–0.7) que aparece sobre ink.
  # As versões antigas (rgb 0 0 0 / 0.1) somem no dark e foram refeitas para v3.
  sm:  "0 1px 2px 0 rgb(0 0 0 / 0.45)"
  md:  "0 4px 10px -2px rgb(0 0 0 / 0.5), 0 2px 4px -2px rgb(0 0 0 / 0.4)"
  lg:  "0 12px 28px -6px rgb(0 0 0 / 0.6), 0 4px 8px -4px rgb(0 0 0 / 0.45)"
  xl:  "0 24px 48px -12px rgb(0 0 0 / 0.7), 0 8px 16px -8px rgb(0 0 0 / 0.5)"
  # ── Elevation / glow (tint âmbar para profundidade premium no dark) ──
  # glow-bica: halo âmbar para CTAs e cards em foco/ativos
  glow-bica:    "0 0 0 1px rgba(201, 163, 104, 0.18), 0 8px 24px -6px rgba(201, 163, 104, 0.30)"
  glow-bica-sm: "0 0 0 1px rgba(201, 163, 104, 0.16), 0 4px 14px -4px rgba(201, 163, 104, 0.28)"
  glow-amp:     "0 0 0 1px rgba(185, 28, 28, 0.20), 0 8px 24px -6px rgba(185, 28, 28, 0.32)"
  # inner: borda interna sutil para dar volume em superfícies elevadas
  inner-hairline: "inset 0 1px 0 0 rgba(244, 236, 220, 0.04)"

# ── Gradientes (additive v3) ──────────────────────────────────────
# Gradients sutis de superfície e de marca. Usados como background-image.
gradient:
  # Superfície: ink2 → ink3, dá profundidade vertical em cards
  surface:      "linear-gradient(180deg, #14100D 0%, #1C1612 100%)"
  # Superfície elevada: ink3 → ink4 (hover/active de cards interativos)
  surface-raised: "linear-gradient(180deg, #1C1612 0%, #2A211A 100%)"
  # Brand Bica: âmbar → âmbar-dark para CTAs premium
  brand-bica:   "linear-gradient(135deg, #C9A368 0%, #B98D4E 100%)"
  # Brand AMP: tijolo → tijolo-dark
  brand-amp:    "linear-gradient(135deg, #B91C1C 0%, #991818 100%)"
  # Sheen: brilho diagonal sutil sobreposto a CTAs (overlay)
  sheen:        "linear-gradient(135deg, rgba(244,236,220,0.16) 0%, rgba(244,236,220,0) 55%)"

focus:
  # Anel de foco acessível âmbar (WCAG 2.4.7). offset garante contraste no dark.
  ring:        "0 0 0 2px var(--color-ink), 0 0 0 4px var(--color-primary-dynamic)"
  ring-width:  "2px"
  ring-offset: "2px"

transition:
  fast:    "150ms cubic-bezier(0.16, 1, 0.3, 1)"
  normal:  "200ms cubic-bezier(0.16, 1, 0.3, 1)"
  slow:    "300ms cubic-bezier(0.16, 1, 0.3, 1)"
  # Curva de microinteração (lift/scale em hover) — easeOutExpo suave
  spring:  "260ms cubic-bezier(0.34, 1.56, 0.64, 1)"

touch:
  target: "52px"   # WCAG 2.5.5 AAA

z-index:
  base:    "0"
  above:   "10"
  nav:     "100"
  modal:   "200"
  toast:   "300"
  tooltip: "400"
